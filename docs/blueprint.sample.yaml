# Devin環境設定（blueprint）のサンプル
# Devinのリポジトリ設定画面（Environment / Blueprint）に貼り付けて調整してください。
# initialize  : ビルド時のみ実行され、スナップショットに保存される（ランタイム・OSパッケージ）
# maintenance : 依存関係の更新。ビルド時に実行され、セッション開始時にDevinへ提示される
# knowledge   : 実行されない参照情報。lint/test/build コマンドを書く

initialize:
  - name: Install Python 3.11
    command: |
      sudo apt-get update -y
      sudo apt-get install -y python3.11 python3.11-venv
  - name: Create venv
    command: |
      cd ~/repos/devin-practice
      python3.11 -m venv .venv

maintenance:
  - name: Install project (editable) with dev deps
    command: |
      cd ~/repos/devin-practice
      source .venv/bin/activate
      pip install -e ".[dev]"

knowledge:
  - name: lint
    command: source .venv/bin/activate && ruff check .
  - name: test
    command: source .venv/bin/activate && pytest -q
  - name: run
    command: source .venv/bin/activate && taskman --help
  - name: notes
    text: |
      ビジネスロジックは src/taskman/service.py に置く。
      テストは tmp_path フィクスチャで一時JSONファイルを使い、~/.taskman.json を汚さない。
